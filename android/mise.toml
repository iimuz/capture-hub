[tools]
java = "temurin-21.0.12+8.0.LTS"
ktlint = "1.8.0"

[tasks.setup]
description = "Set up the Android development environment"
run = '''
if [ -f local.properties ]; then exit 0; fi
sdk_dir="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
if [ ! -d "$sdk_dir" ]; then
  echo "Android SDK not found: $sdk_dir" >&2
  echo "Install the Android SDK, or set sdk.dir manually in android/local.properties" >&2
  exit 1
fi
echo "sdk.dir=$sdk_dir" > local.properties
'''

[tasks.build]
description = "Build, test, and lint the Android app"
depends = ["setup"]
run = "./gradlew build"

[tasks.test]
description = "Run the Android unit tests"
depends = ["setup"]
run = "./gradlew test"

[tasks.clean]
description = "Remove the Android build artifacts and local configuration"
run = '''
rm -rf .gradle .kotlin build app/build
rm -f local.properties
'''

[tasks."format:kotlin"]
description = "Format Kotlin files with ktlint"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.kt' '*.kts' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
ktlint --format "$@"
'''

[tasks.format]
description = "Format all Android files"
depends = ["format:kotlin"]

[tasks."lint:kotlin"]
description = "Check Kotlin files with ktlint"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.kt' '*.kts' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
ktlint "$@"
'''

[tasks.lint]
description = "Check all Android files"
depends = ["lint:kotlin"]
