monorepo_root = true

[monorepo]
config_roots = ["android"]

[tools]
node = "24.18.0"
"npm:prettier" = "3.9.5"
"npm:markdownlint-cli2" = "0.23.1"
taplo = "0.10.0"
lefthook = "2.1.10"

[env]
_.file = ".env"

[tasks."format:md"]
description = "Format Markdown files with prettier"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.md' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
prettier --write --no-error-on-unmatched-pattern "$@"
'''

[tasks."format:yaml"]
description = "Format YAML files with prettier"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.yml' '*.yaml' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
prettier --write --no-error-on-unmatched-pattern "$@"
'''

[tasks."format:json"]
description = "Format JSON files with prettier"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.json' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
prettier --write --no-error-on-unmatched-pattern "$@"
'''

[tasks."format:toml"]
description = "Format TOML files with taplo"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.toml' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
taplo format "$@"
'''

[tasks.format]
description = "Format all files"
depends = [
  "format:md",
  "format:yaml",
  "format:json",
  "format:toml",
  "//android:format",
]

[tasks."lint:md"]
description = "Check Markdown files with markdownlint-cli2"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.md' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
markdownlint-cli2 "$@"
'''

[tasks."lint:prettier"]
description = "Check formatting differences with prettier"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.md' '*.yml' '*.yaml' '*.json' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
prettier --check --no-error-on-unmatched-pattern "$@"
'''

[tasks."lint:toml"]
description = "Check TOML formatting differences with taplo"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.toml' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
taplo format --check "$@"
'''

[tasks.lint]
description = "Check all files"
depends = ["lint:md", "lint:prettier", "lint:toml", "//android:lint"]

[tasks.setup]
description = "Set up the development environment"
depends_post = ["//android:setup"]
run = '''
# Skipped in a git worktree; the root repository's lefthook configuration is used there
if [ -d ".git" ]; then
  lefthook install
fi
'''

[tasks.clean]
description = "Remove the development environment configuration and build artifacts"
depends = ["//android:clean"]
run = '''
if [ -d ".git" ]; then
  lefthook uninstall
fi
'''

[tasks.build]
description = "Build all components"
depends = ["//android:build"]

[tasks.test]
description = "Run tests for all components"
depends = ["//android:test"]
